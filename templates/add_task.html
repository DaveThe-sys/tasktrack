{% extends 'base.html' %}

{% block title %}Add Task | TaskTrack{% endblock %}

{% block content %}
<style>
    .centering-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 150px);
        width: 100%;
    }

    .box {
        width: 100%;
        max-width: 450px;
        padding: 35px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 14px;
        margin-top: 15px;
        border: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        outline: none;
        font-size: 1rem;
    }

    textarea {
        resize: none;
    }

    input::placeholder, textarea::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    
        select option {
            background: #1e3a8a;
            color: white;
        }
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
    }

    select option {
        background: #1e3a8a;
        color: white;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(to right, #2563eb, #60a5fa);
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.02);
        opacity: 0.9;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 0.9rem;
    }

    .back-link:hover {
        color: white;
    }
</style>

<div class="centering-wrapper">
    <div class="box">
        <h1>Add Task</h1>

        <form action="/add_task" method="POST">
            <input
                type="text"
                name="title"
                placeholder="Task Title"
                required
            >

            <textarea
                name="description"
                placeholder="Description"
                rows="3"
            ></textarea>

            <input
                type="text"
                name="category"
                placeholder="Category (e.g., Work, School)"
                list="category-suggestions"
                required
            >
            
            <datalist id="category-suggestions">
                <option value="Work">
                <option value="School">
                <option value="Personal">
                <option value="Cleaning">
                <option value="Errands">
                <option value="Health">
            </datalist>

            <select name="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

            <div style="margin-top: 15px; text-align: left;">
                <label style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; padding-left: 14px;">Deadline:</label>
                <input type="date" name="due_date" id="due_date" style="margin-top: 5px;" required>
            </div>

            <button type="submit">
                Create Task
            </button>

            <a href="/dashboard" class="back-link">Cancel</a>
        </form>
    </div>
</div>

<script>
    const dateInput = document.getElementById('due_date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);
</script>
{% endblock %}
