{% extends "base.html" %}

{% block title %}Calendar - TaskTrack{% endblock %}

{% block content %}
<style>
    .calendar-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        min-height: 90vh;
        width: 100%;
    }

    .calendar-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 40px;
        width: 100%;
        max-width: 1200px;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
    }

    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
    }

    .month-title {
        font-size: 2.5rem;
        font-weight: 900;
        color: #fff;
        background: linear-gradient(to right, #ffffff, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .calendar-grid {
        display: grid !important;
        grid-template-columns: repeat(7, 1fr) !important;
        gap: 15px;
        width: 100%;
    }

    .weekday {
        text-align: center;
        color: #60a5fa;
        font-weight: 800;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        padding-bottom: 20px;
    }

    .calendar-day {
        aspect-ratio: 1.2 / 1;
        min-height: 110px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 18px;
        padding: 15px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
    }

    .past-day {
        filter: grayscale(100%);
        opacity: 0.35;
        background: rgba(255, 255, 255, 0.01);
    }

    .calendar-day:hover:not(.past-day) {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-5px);
        border-color: rgba(96, 165, 250, 0.5);
    }

    .calendar-day.has-tasks {
        background: rgba(96, 165, 250, 0.05);
        border-color: rgba(96, 165, 250, 0.3);
    }

    .task-indicator {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 8px;
        height: 8px;
        background: #60a5fa;
        border-radius: 50%;
        box-shadow: 0 0 12px #60a5fa;
    }

    .today {
        border: 2px solid #60a5fa !important;
        background: rgba(96, 165, 250, 0.15) !important;
        opacity: 1 !important;
        filter: none !important;
    }

    .day-number {
        font-size: 1.3rem;
        font-weight: 800;
        color: #fff;
    }

    .task-summary {
        font-size: 0.75rem;
        font-weight: 600;
        color: #60a5fa;
        background: rgba(96, 165, 250, 0.15);
        padding: 4px 8px;
        border-radius: 8px;
        width: fit-content;
    }

    .zoom-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(15px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .zoom-card {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 32px;
        width: 90%;
        max-width: 450px;
        transform: scale(0.8);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
        color: #fff;
    }

    .zoom-overlay.active { display: flex; }
    .zoom-overlay.active .zoom-card { transform: scale(1); }

    .zoom-task-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 15px;
        margin-bottom: 12px;
        text-align: left;
        border-left: 4px solid #60a5fa;
    }

    .btn-nav {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-close {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        margin-top: 20px;
    }
</style>

<div class="calendar-container">
    <div class="calendar-card">
        <div class="calendar-header">
            <h1 class="month-title" id="displayMonth"></h1>
            <div style="display: flex; gap: 15px;">
                <button class="btn-nav" onclick="changeMonth(-1)">&larr;</button>
                <button class="btn-nav" onclick="changeMonth(1)">&rarr;</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
    <div class="zoom-card" onclick="event.stopPropagation()">
        <h2 id="zoomDateText" style="color: #60a5fa; font-size: 2rem;"></h2>
        <p id="zoomDayName" style="opacity: 0.6; margin-bottom: 25px;"></p>
        <div id="zoomTaskList"></div>
        <button class="btn-close" onclick="closeZoom()">Back to Calendar</button>
    </div>
</div>

<script>
    const userTasks = {{ tasks|tojson }};
    let currentDate = new Date();

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const displayMonth = document.getElementById('displayMonth');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        displayMonth.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        weekdays.forEach(day => {
            const el = document.createElement('div');
            el.className = 'weekday';
            el.innerText = day;
            grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        today.setHours(0,0,0,0);

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-day';
            empty.style.opacity = '0';
            empty.style.pointerEvents = 'none';
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const tasks = userTasks.filter(t => t.due_date === dateStr);
            
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            
            const iterDate = new Date(year, month, day);
            iterDate.setHours(0,0,0,0);

            if (iterDate < today) {
                dayEl.classList.add('past-day');
            } else if (iterDate.getTime() === today.getTime()) {
                dayEl.classList.add('today');
            }

            if (tasks.length > 0) dayEl.classList.add('has-tasks');

            dayEl.innerHTML = `
                <span class="day-number">${day}</span>
                ${tasks.length > 0 ? '<div class="task-indicator"></div>' : ''}
                ${tasks.length > 0 ? `<div class="task-summary">${tasks.length} Tasks</div>` : ''}
            `;

            dayEl.onclick = () => openZoom(day, month, year, tasks);
            grid.appendChild(dayEl);
        }
    }

    function openZoom(day, month, year, tasks) {
        const d = new Date(year, month, day);
        document.getElementById('zoomDateText').innerText = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        document.getElementById('zoomDayName').innerText = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric' });
        
        const list = document.getElementById('zoomTaskList');
        list.innerHTML = tasks.length ? tasks.map(t => `
            <div class="zoom-task-item">
                <div style="font-weight:700; color:#60a5fa;">${t.title}</div>
                <div style="font-size:0.85rem; opacity:0.8;">Priority: ${t.priority}</div>
            </div>
        `).join('') : '<p style="opacity:0.5; padding: 20px;">No missions for today.</p>';

        document.getElementById('zoomOverlay').classList.add('active');
    }

    function closeZoom() { document.getElementById('zoomOverlay').classList.remove('active'); }
    function changeMonth(offset) { currentDate.setMonth(currentDate.getMonth() + offset); renderCalendar(); }

    renderCalendar();
</script>
{% endblock %}
